name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify Cargo.toml version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag -replace '^v', ''
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "No version found in Cargo.toml" }
          $actual = $line.Matches[0].Groups[1].Value
          if ($actual -ne $expected) { throw "Cargo.toml version $actual does not match tag $tag" }

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "virtual-desktop-display-$tag-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/$name.zip"
          Compress-Archive -Path target/release/virtual-desktop-display.exe, README.md, LICENSE -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag (Get-ChildItem dist).FullName --title $tag --generate-notes
